// Laya decision daemon — gRPC surface for CLI ⇄ backend (the Swift port's
// machine-to-machine protocol; the HTTP /v1/laya wire stays the exact
// Python-version contract and is served alongside).
//
// JSON values travel as bytes so BOTH sides round-trip the identical
// document (ordered criteria keys are load-bearing for the argmax rule).
syntax = "proto3";

package laya.v1;

message Empty {}

message HealthReply {
  // Exact JSON document from GET /health of the HTTP surface.
  bytes json = 1;
}

message ModelsReply {
  bytes json = 1;
}

message AskRequest {
  // Full question-API request envelope: {state, model?, questions:{name:q}}
  bytes json = 1;
}

message AskReply {
  // Full question-API response envelope, or the refusal body.
  bytes json = 1;
  int32 http_status = 2;   // mirrors the HTTP status the same request gets
}

message EngineResultReply {
  // Raw engine result {task, chain, choice, confidence, acted, act_p,
  // probs, latency_ms} — what RemoteEngine.question() reshapes into.
  bytes json = 1;
}

message EngineQuestion {
  string name = 1;
  bytes question_json = 2;   // {type, instructions, criteria?, route_task?}
  bytes state_json = 3;      // state: string | object | array as JSON
}

service LayaDecision {
  rpc Health(Empty) returns (HealthReply);
  rpc Models(Empty) returns (ModelsReply);
  // One HTTP-equivalent question-API round over gRPC (batch of questions).
  rpc Ask(AskRequest) returns (AskReply);
  // Engine-duck call used by remote use-case clients (one question).
  rpc Question(EngineQuestion) returns (EngineResultReply);
}
